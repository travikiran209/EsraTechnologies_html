<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
.gallery-card{

    overflow:hidden;
    border-radius:15px;

}

.gallery-img{

    transition:.4s;
}

.gallery-card:hover .gallery-img{

    transform:scale(1.08);

}
.gallery-img{
    cursor:pointer;
}

.image-open{

    max-height:90vh;
    max-width:95vw;

    transform:scale(.6);
    opacity:0;

    transition:all .35s ease;

}

.modal.show .image-open{

    transform:scale(1);
    opacity:1;

}

.modal-content{

    background:#000;

}
body{
    background:#f5f5f5;
}
.gallery-card{
    overflow:hidden;
    border-radius:15px;
    transition:.3s;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.gallery-card:hover{
    transform:translateY(-8px);
}
.gallery-img{
    height:250px;
    width:100%;
    object-fit:cover;
    transition:.5s;
}
.gallery-card:hover .gallery-img{
    transform:scale(1.08);
}
</style>

</head>

<body>
<!-- Image Viewer -->
<div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 bg-transparent">

            <div class="modal-header border-0 p-2">
                <button type="button"
                        class="btn-close btn-close-white ms-auto"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>
            </div>

            <div class="modal-body text-center p-0">

                <img id="modalImage"
                     class="img-fluid rounded shadow-lg image-open">

            </div>

        </div>
    </div>
</div>
<div class="container py-5">

<!-- NAVBAR -->
<iframe src="../navbar.html"
        style="width:100%; height:50px; border:none;
               position:fixed; top:0; left:0; z-index:9999;">
</iframe>
<!-- CONTENT -->

<div class="table-card shadow-lg">
<h2 class="mb-1 text-center">Gallery</h2>

<div class="row g-4" id="gallery"></div>

</div>

<script>

const gallery=document.getElementById("gallery");

const totalImages=100;       // <-- Change this number only

for(let i=1;i<=totalImages;i++){

gallery.innerHTML+=`

<div class="col-lg-4 col-md-6">

<div class="card gallery-card">

<img
src="./images/image${i}.jpg"

class="gallery-img"

loading="lazy"

alt="Image ${i}"

onclick="openImage(this.src)"

/>

</div>

</div>

`;

}

// Hide missing images automatically

document.querySelectorAll(".gallery-img").forEach(img=>{

img.onerror=function(){

this.parentElement.parentElement.remove();

}

});

function openImage(src){

document.getElementById("modalImage").src=src;

new bootstrap.Modal(

document.getElementById("imageModal")

).show();

}

</script>


</body>
</html>
